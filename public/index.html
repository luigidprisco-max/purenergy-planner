<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PurEnergy Planner - Gestionale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
        
        .pac-container {
            z-index: 1050 !important;
        }
        
        .sidebar-link:hover, .sidebar-link-active {
            background-color: #4f46e5; /* Indigo 600 */
        }
        .sidebar-link:hover, .sidebar-link-active, .sidebar-link-active i, .sidebar-link-active span {
            color: white;
        }
        .dashboard-card {
             transition: all 0.2s ease-in-out;
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

    </style>
</head>

<body class="bg-gray-100 text-gray-800">
    <div class="flex h-screen overflow-hidden">
        
        <!-- Mobile menu overlay -->
        <div id="mobile-menu-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-20 md:hidden hidden"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="bg-gray-800 text-gray-200 w-64 space-y-6 py-7 px-2 absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-200 ease-in-out z-30">
            <div id="sidebar-header" class="flex items-center justify-center px-4">
                 <span class="text-white text-2xl font-extrabold">PurEnergy Planner</span>
            </div>

            <nav>
                <a href="#" onclick="window.switchTab('dashboard', event)" id="tab-dashboard" class="tab-link sidebar-link-active sidebar-link flex items-center space-x-2 py-2.5 px-4 rounded-lg transition duration-200">
                    <i class="fas fa-home w-6 text-center"></i>
                    <span>Home</span>
                </a>
                <a href="#" onclick="window.switchTab('planner', event)" id="tab-planner" class="tab-link sidebar-link flex items-center space-x-2 py-2.5 px-4 rounded-lg transition duration-200">
                    <i class="fas fa-calendar-alt w-6 text-center"></i>
                    <span>Pianificazione</span>
                </a>
                <a href="#" onclick="window.switchTab('summary', event)" id="tab-summary" class="tab-link sidebar-link flex items-center space-x-2 py-2.5 px-4 rounded-lg transition duration-200">
                    <i class="fas fa-chart-bar w-6 text-center"></i>
                    <span>Riepilogo</span>
                </a>
                <a href="#" onclick="window.switchTab('archive', event)" id="tab-archive" class="tab-link sidebar-link flex items-center space-x-2 py-2.5 px-4 rounded-lg transition duration-200">
                     <i class="fas fa-archive w-6 text-center"></i>
                    <span>Archivio</span>
                </a>
            </nav>
        </aside>

        <!-- Main content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
             <header class="bg-white shadow-md p-4 flex items-center justify-between">
                <button id="mobile-menu-button" class="md:hidden text-gray-600">
                    <i class="fas fa-bars text-2xl"></i>
                </button>
                <h1 id="mobile-page-title" class="text-2xl font-bold text-gray-700">Home</h1>
                 <div class="w-8"></div> <!-- Spacer -->
            </header>

            <main id="app-container" class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-4 md:p-8">
                
                <div id="auth-error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative mb-4" role="alert">
                    Errore di autenticazione.
                </div>

                <!-- Dashboard Content -->
                <div id="content-dashboard" class="content-view">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <!-- Card Interventi Oggi -->
                        <div class="dashboard-card bg-green-500 text-white p-6 rounded-lg shadow-lg flex flex-col justify-between">
                            <div>
                                <h3 class="text-lg font-semibold uppercase">Interventi Oggi</h3>
                                <p class="text-5xl font-bold mt-2" id="dash-today">0</p>
                            </div>
                            <div class="text-right text-3xl opacity-70">
                                <i class="fas fa-calendar-day"></i>
                            </div>
                        </div>
                        <!-- Card Interventi Domani -->
                        <div class="dashboard-card bg-yellow-500 text-white p-6 rounded-lg shadow-lg flex flex-col justify-between">
                            <div>
                                <h3 class="text-lg font-semibold uppercase">Interventi Domani</h3>
                                <p class="text-5xl font-bold mt-2" id="dash-tomorrow">0</p>
                            </div>
                             <div class="text-right text-3xl opacity-70">
                                <i class="fas fa-clock"></i>
                            </div>
                        </div>
                        <!-- Card Interventi Futuri -->
                        <div class="dashboard-card bg-blue-500 text-white p-6 rounded-lg shadow-lg flex flex-col justify-between">
                             <div>
                                <h3 class="text-lg font-semibold uppercase">Interventi Futuri</h3>
                                <p class="text-5xl font-bold mt-2" id="dash-future">0</p>
                            </div>
                             <div class="text-right text-3xl opacity-70">
                                <i class="fas fa-calendar-alt"></i>
                            </div>
                        </div>
                        <!-- Card Tecnici Occupati -->
                         <div class="dashboard-card bg-teal-500 text-white p-6 rounded-lg shadow-lg flex flex-col justify-between">
                            <div>
                                <h3 class="text-lg font-semibold uppercase">Tecnici Occupati Oggi</h3>
                                <p class="text-5xl font-bold mt-2" id="dash-techs-today">0 / 3</p>
                            </div>
                             <div class="text-right text-3xl opacity-70">
                                <i class="fas fa-users"></i>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- Planner Content -->
                <div id="content-planner" class="content-view hidden">
                    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-4xl mx-auto">
                        <h2 class="text-3xl font-bold text-gray-800 mb-6">Trova Disponibilità</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="client-search" class="block text-sm font-medium text-gray-700">Indirizzo Cliente</label>
                                <input type="text" id="client-search" placeholder="Es: Via Roma 1, Napoli" class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                            </div>
                            <div>
                                <label for="summary-date-planner" class="block text-sm font-medium text-gray-700">Data (opzionale)</label>
                                <input type="date" id="summary-date-planner" class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                            </div>
                        </div>
                        <div class="mt-6 flex justify-end">
                            <button id="search-availability" class="bg-indigo-600 text-white font-bold py-2 px-6 rounded-lg shadow-md hover:bg-indigo-700 transition-colors duration-200 flex items-center">
                                <i class="fas fa-search mr-2"></i>Cerca
                            </button>
                        </div>
                        <div id="loader" class="hidden mt-4 mx-auto loader"></div>
                        <div id="availability-results" class="mt-8"></div>
                    </div>
                </div>

                <!-- Summary Content -->
                <div id="content-summary" class="content-view hidden">
                    <div class="bg-white p-8 rounded-2xl shadow-xl">
                         <div class="flex justify-between items-center mb-6">
                            <h2 class="text-3xl font-bold text-gray-800">Riepilogo Appuntamenti</h2>
                             <input type="date" id="summary-date" class="border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        </div>
                        <div id="summary-view" class="space-y-4"></div>
                         <div id="map" class="mt-6 w-full h-96 rounded-lg shadow-md bg-gray-200"></div>
                    </div>
                </div>
                 <!-- Archive Content -->
                <div id="content-archive" class="content-view hidden">
                     <div class="bg-white p-8 rounded-2xl shadow-xl">
                        <h2 class="text-3xl font-bold text-gray-800 mb-6">Archivio Appuntamenti</h2>
                        <div id="archive-view" class="space-y-4"></div>
                    </div>
                </div>

            </main>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, onSnapshot, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAE3mj6ePvieSdSJtidGAj08UbTYIAoSP4",
            authDomain: "purenergy-planner-8bce1.firebaseapp.com",
            projectId: "purenergy-planner-8bce1",
            storageBucket: "purenergy-planner-8bce1.firebasestorage.app",
            messagingSenderId: "1004722434971",
            appId: "1:1004722434971:web:23aec52fbefde3f6d9673e"
        };
        
        let app, db, auth, userId;
        let appointments = new Map();
        const technicians = ['Daniele', 'Carmine', 'Ernesto'];

        const signInAndInitialize = async () => {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        userId = user.uid;
                        console.log("User signed in:", userId);
                        document.getElementById('auth-error').classList.add('hidden');
                        listenForAppointments();
                    } else {
                        await signInAnonymously(auth);
                    }
                });

            } catch (error) {
                console.error("Firebase Initialization or Auth Error:", error);
                const errorElement = document.getElementById('auth-error');
                errorElement.textContent = `Errore di autenticazione: ${error.code}. Dettagli: ${error.message}. Assicurati che il dominio sia autorizzato nelle impostazioni di Authentication di Firebase e che la chiave API di Google Maps sia configurata correttamente in Google Cloud.`;
                errorElement.classList.remove('hidden');
            }
        };

        function listenForAppointments() {
            if (!userId) return;
            const q = query(collection(db, `users/${userId}/appointments`));
            onSnapshot(q, (snapshot) => {
                const appointmentsArray = [];
                snapshot.forEach((doc) => {
                    appointmentsArray.push({ id: doc.id, ...doc.data() });
                });
                appointments = new Map(appointmentsArray.map(apt => [apt.id, apt]));
                console.log("Appointments updated:", appointments.size);
                updateAll();
            });
        }
        
        function updateAll() {
            updateDashboardCards();
            if(document.getElementById('content-summary').classList.contains('hidden') === false) displayDailySummary();
            if(document.getElementById('content-archive').classList.contains('hidden') === false) displayArchive();
            updateMap();
        }

        function switchTab(tab, event) {
            if (event) event.preventDefault();
            
            document.querySelectorAll('.content-view').forEach(view => view.classList.add('hidden'));
            document.getElementById(`content-${tab}`).classList.remove('hidden');

            document.querySelectorAll('.tab-link').forEach(link => {
                link.classList.remove('sidebar-link-active');
            });
            document.getElementById(`tab-${tab}`).classList.add('sidebar-link-active');

            const tabTitles = { 'dashboard': 'Home', 'planner': 'Pianificazione', 'summary': 'Riepilogo', 'archive': 'Archivio'};
            document.getElementById('mobile-page-title').textContent = tabTitles[tab];
            
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth < 768 && !sidebar.classList.contains('-translate-x-full')) {
                document.getElementById('mobile-menu-button').click();
            }

            if (tab === 'summary') {
                document.getElementById('summary-date').value = new Date().toISOString().split('T')[0];
                displayDailySummary();
            }
            if (tab === 'archive') displayArchive();
            if (tab === 'dashboard') updateAll();
        }

        async function handleAddressCheck() {
            const address = document.getElementById('client-search').value;
            const dateInput = document.getElementById('summary-date-planner').value;
            const loader = document.getElementById('loader');
            const resultsDiv = document.getElementById('availability-results');
            resultsDiv.innerHTML = '';
            
            if (!address) {
                alert("Per favore, inserisci un indirizzo.");
                return;
            }

            loader.classList.remove('hidden');

            const searchStartDate = dateInput ? new Date(dateInput) : new Date();
             if (!dateInput) {
                searchStartDate.setDate(searchStartDate.getDate() + 1); // Start from tomorrow if no date is set
            }
            searchStartDate.setHours(0, 0, 0, 0);

            const timeSlots = ['09:00', '11:00', '14:00', '16:00'];
            let availableSlots = [];
            
            for (let i = 0; i < 7; i++) { // Increased search to 7 days
                const currentDate = new Date(searchStartDate);
                currentDate.setDate(currentDate.getDate() + i);
                const dateStr = currentDate.toISOString().split('T')[0];

                const dailyAppointments = Array.from(appointments.values()).filter(a => a.date === dateStr);
                
                for (const tech of technicians) {
                    const techAppointments = dailyAppointments.filter(a => a.technician === tech);
                    
                    for (const slot of timeSlots) {
                        const isSlotTaken = techAppointments.some(a => a.time === slot);
                        if (!isSlotTaken) {
                            const nearbyAppointments = dailyAppointments.filter(a => a.technician === tech);
                            const isNear = nearbyAppointments.length > 0;
                            availableSlots.push({ date: dateStr, time: slot, technician: tech, near: isNear });
                        }
                    }
                }
            }

            loader.classList.add('hidden');
            
            if (availableSlots.length > 0) {
                 availableSlots.sort((a, b) => {
                    if (a.date < b.date) return -1;
                    if (a.date > b.date) return 1;
                    if (a.time < b.time) return -1;
                    if (a.time > b.time) return 1;
                    if (a.near && !b.near) return -1;
                    if (!a.near && b.near) return 1;
                    return 0;
                });
                
                resultsDiv.innerHTML = '<h3 class="text-xl font-semibold mb-4">Slot Disponibili:</h3>';
                availableSlots.forEach(slot => {
                    const bgColor = slot.near ? 'bg-green-100 hover:bg-green-200' : 'bg-blue-100 hover:bg-blue-200';
                    const textColor = slot.near ? 'text-green-800' : 'text-blue-800';
                    const borderColor = slot.near ? 'border-green-300' : 'border-blue-300';
                    const buttonHtml = `
                        <div class="p-4 rounded-lg border ${borderColor} ${bgColor} ${textColor} transition-all duration-200 cursor-pointer mb-2" 
                             onclick="window.createAppointment('${slot.date}', '${slot.time}', '${slot.technician}', '${address.replace(/'/g, "\\'")}')">
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="font-bold text-lg">${new Date(slot.date).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' })} - ${slot.time}</p>
                                    <p>Tecnico: <span class="font-semibold">${slot.technician}</span></p>
                                </div>
                                ${slot.near ? '<span class="text-sm font-medium bg-green-500 text-white py-1 px-3 rounded-full">In Zona</span>' : ''}
                            </div>
                        </div>`;
                    resultsDiv.innerHTML += buttonHtml;
                });
            } else {
                resultsDiv.innerHTML = '<p class="text-center text-red-500">Nessuna disponibilità trovata nei prossimi 7 giorni.</p>';
            }
        }
        
        async function createAppointment(date, time, technician, address) {
            if (!userId) return;
            const newApt = { date, time, technician, address, status: 'scheduled' };
            try {
                await addDoc(collection(db, `users/${userId}/appointments`), newApt);
                alert(`Appuntamento creato per il ${date} alle ${time} con ${technician}.`);
                document.getElementById('availability-results').innerHTML = '';
                document.getElementById('client-search').value = '';
                document.getElementById('summary-date-planner').value = '';
                document.getElementById('summary-date').value = date;
                switchTab('summary');
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("Errore nella creazione dell'appuntamento.");
            }
        }

        function displayDailySummary() {
            const summaryView = document.getElementById('summary-view');
            summaryView.innerHTML = '';
            const selectedDate = document.getElementById('summary-date').value || new Date().toISOString().split('T')[0];
            
            const dailyAppointments = Array.from(appointments.values())
                .filter(apt => apt.date === selectedDate && apt.status === 'scheduled')
                .sort((a,b) => a.time.localeCompare(b.time));

            if (dailyAppointments.length === 0) {
                summaryView.innerHTML = `<p class="text-center text-gray-500">Nessun appuntamento per il ${new Date(selectedDate + 'T00:00:00').toLocaleDateString('it-IT', { day: 'numeric', month: 'long' })}.</p>`;
                updateMap([]);
                return;
            }
            
            technicians.forEach(tech => {
                const techAppointments = dailyAppointments.filter(apt => apt.technician === tech);
                if (techAppointments.length > 0) {
                    let techHtml = `<div class="mb-6"><h3 class="text-xl font-bold text-gray-700 mb-2">${tech}</h3><div class="space-y-3">`;
                    techAppointments.forEach(apt => {
                       techHtml += `
                        <div class="bg-white p-4 rounded-lg shadow-md border-l-4 border-indigo-500">
                            <p class="font-semibold">${apt.time} - ${apt.address}</p>
                            <div class="text-right mt-2 space-x-4">
                                <button class="text-sm text-green-600 hover:text-green-800 font-semibold" onclick="window.updateAppointmentStatus('${apt.id}', 'completed')"><i class="fas fa-check mr-1"></i>Completato</button>
                                <button class="text-sm text-red-600 hover:text-red-800 font-semibold" onclick="window.updateAppointmentStatus('${apt.id}', 'canceled')"><i class="fas fa-times mr-1"></i>Annullato</button>
                            </div>
                        </div>`;
                    });
                    techHtml += '</div></div>';
                    summaryView.innerHTML += techHtml;
                }
            });
            updateMap(dailyAppointments);
        }
        
        document.getElementById('summary-date').addEventListener('change', displayDailySummary);

        function displayArchive() {
            const archiveView = document.getElementById('archive-view');
            archiveView.innerHTML = '';
            const archivedAppointments = Array.from(appointments.values())
                .filter(apt => apt.status === 'completed' || apt.status === 'canceled')
                 .sort((a,b) => new Date(b.date) - new Date(a.date));

            if (archivedAppointments.length === 0) {
                archiveView.innerHTML = '<p class="text-center text-gray-500">Nessun appuntamento archiviato.</p>';
                return;
            }
            
            archivedAppointments.forEach(apt => {
                const statusColor = apt.status === 'completed' ? 'text-green-600' : 'text-red-600';
                const statusIcon = apt.status === 'completed' ? 'fa-check-circle' : 'fa-times-circle';
                const statusText = apt.status === 'completed' ? 'Completato' : 'Annullato';
                archiveView.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow-sm border">
                        <p class="text-gray-600">${new Date(apt.date + 'T00:00:00').toLocaleDateString('it-IT', {weekday: 'long', day: 'numeric', month: 'long'})} - ${apt.time}</p>
                        <p class="font-semibold">${apt.address} (${apt.technician})</p>
                        <p class="font-semibold ${statusColor} mt-1"><i class="fas ${statusIcon} mr-1"></i>${statusText}</p>
                    </div>`;
            });
        }
        
        async function updateAppointmentStatus(id, status) {
            if (!userId) return;
            const aptRef = doc(db, `users/${userId}/appointments`, id);
            try {
                await setDoc(aptRef, { status: status }, { merge: true });
                console.log(`Appointment ${id} status updated to ${status}`);
            } catch (e) {
                console.error("Error updating status: ", e);
            }
        }

        function updateDashboardCards() {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            const todayString = today.toISOString().split('T')[0];
            const tomorrowString = tomorrow.toISOString().split('T')[0];

            let todayCount = 0;
            let tomorrowCount = 0;
            let futureCount = 0;
            const busyTechsToday = new Set();
            
            for (const apt of appointments.values()) {
                 if (apt.status === 'scheduled') {
                    if (apt.date === todayString) {
                        todayCount++;
                        busyTechsToday.add(apt.technician);
                    } else if (apt.date === tomorrowString) {
                        tomorrowCount++;
                    } else if (apt.date > tomorrowString) {
                        futureCount++;
                    }
                }
            }
            
            document.getElementById('dash-today').textContent = todayCount;
            document.getElementById('dash-tomorrow').textContent = tomorrowCount;
            document.getElementById('dash-future').textContent = futureCount;
            document.getElementById('dash-techs-today').textContent = `${busyTechsToday.size} / ${technicians.length}`;
        }
        
        function updateMap(appts) {
            // Placeholder for map functionality
            const mapDiv = document.getElementById('map');
            if (mapDiv) {
                if (appts && appts.length > 0) {
                     mapDiv.innerHTML = `<p class="p-4 text-center text-gray-600">Mappa degli appuntamenti per il giorno selezionato. (${appts.length} interventi)</p>`;
                } else {
                    mapDiv.innerHTML = '<p class="p-4 text-center text-gray-500">Nessun appuntamento da mostrare sulla mappa.</p>';
                }
            }
        }
        
        // Setup UI event listeners
        document.getElementById('search-availability').addEventListener('click', handleAddressCheck);
        
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobile-menu-overlay');

        mobileMenuButton.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        });
        overlay.addEventListener('click', () => {
             sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        });

        // Funzioni globali esposte
        window.createAppointment = createAppointment;
        window.updateAppointmentStatus = updateAppointmentStatus;
        window.switchTab = switchTab;
        
        // Inizializzazione
        signInAndInitialize();

    </script>
</body>

</html>
